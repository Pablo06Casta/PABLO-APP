name: Actualizar estimaciones y revisar CERCA a las 06:00

on:
  workflow_dispatch:
  schedule:
    # Dos horas UTC cubren las 06:00 de Europe/Madrid en horario de verano e invierno.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: cerca-daily-review
  cancel-in-progress: false

jobs:
  update-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Comprobar las 06:00 en España
        id: local-time
        shell: python
        run: |
          from datetime import datetime
          import json
          from zoneinfo import ZoneInfo
          import os

          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          local = datetime.now(ZoneInfo("Europe/Madrid"))
          state = json.load(open("src/data/real/daily-expansion-state.json", encoding="utf-8"))
          last_run = state.get("lastRunAt")
          last_local_date = None
          if last_run:
              last_local_date = datetime.fromisoformat(last_run).astimezone(ZoneInfo("Europe/Madrid")).date()
          allowed = manual or (local.hour >= 6 and last_local_date != local.date())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"allowed={'true' if allowed else 'false'}\n")
              output.write(f"local_time={local.isoformat()}\n")
      - uses: actions/setup-node@v4
        if: steps.local-time.outputs.allowed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias verificadas
        if: steps.local-time.outputs.allowed == 'true'
        run: npm ci
      - name: Actualizar y auditar el modelo propio de precios
        if: steps.local-time.outputs.allowed == 'true'
        run: python3 scripts/refresh-price-model.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Actualizar establecimientos de fuentes abiertas
        if: steps.local-time.outputs.allowed == 'true'
        run: python3 scripts/daily-expand-establishments.py
      - name: Comprobar la web que está publicada
        if: steps.local-time.outputs.allowed == 'true'
        env:
          CERCA_LIVE_URL: https://pablo06casta.github.io/PABLO-APP/
        run: npm run smoke:live | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Revisar pruebas, tipos, compilación y PWA
        if: steps.local-time.outputs.allowed == 'true'
        run: npm run check
      - name: Guardar y publicar la revisión diaria
        id: save
        if: steps.local-time.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/venues.json src/data/real/osm-stays.json src/data/real/fuel-references.json src/data/real/venue-markets.json src/data/real/daily-expansion-state.json src/data/real/price-model.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Actualiza estimaciones y revisión diaria de CERCA"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Iniciar comprobación y publicación de CERCA
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
