name: Comprobar y publicar CERCA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  build-pages:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CERCA_BASE_PATH: /PABLO-APP/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Usar la aplicación compilada como origen de publicación
        id: source
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: site } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
            if (site.build_type !== 'workflow') {
              await github.request('PUT /repos/{owner}/{repo}/pages', { owner, repo, build_type: 'workflow' });
            }
            const { data: verified } = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
            if (verified.build_type !== 'workflow') throw new Error('GitHub Pages todavía utiliza el publicador de rama.');
            await core.summary.addHeading('Publicación configurada').addRaw('Origen verificado: GitHub Actions. La web utiliza el artefacto compilado de CERCA.').write();
      - name: Comprobar configuración de GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Publicar la aplicación
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Indicar activación pendiente
        if: steps.pages.outcome != 'success'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'INFO'
          ## Publicación pendiente
          La aplicación se ha compilado y el artefacto está preparado. Este paso NO ha publicado la web.
          En Settings → Pages del repositorio, selecciona **GitHub Actions** como Source y guarda.
          Después vuelve a ejecutar este workflow. No hace falta añadir claves privadas al código.
          INFO
